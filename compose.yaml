# Argos — despliegue segmentado (RNF-01, RF-SEC-02).
#
#   scripts/setup-env.sh                                  # .env con UID/GID/rutas
#   docker compose --profile build --profile core build   # imágenes
#   docker compose up -d egress-main egress-osint egress-pentest
#   scripts/argos run "..."                               # segmento main
#   ARGOS_SEGMENT=osint scripts/argos run -p osint "..."   # segmento osint
#
# Cada segmento (main, osint, pentest) tiene su propia red de sandbox (sin salida a Internet),
# su proxy de egress con allowlist y su directorio de datos. Solo `main` recibe la clave age.
#
# Solo el servicio `broker` tiene el socket Docker (control total del host). Los núcleos piden su
# sandbox al broker por un socket Unix de su segmento y no pueden tocar Docker (ADR-0008).
#
# Aislamiento entre segmentos (RF-SEC-02, P2): cada segmento sale a Internet por su propia red
# (argos_egress_<seg>) y no alcanza a los otros. El repo se monta en solo lectura, pero un tmpfs
# vacío tapa `var/` (solo se vuelve a montar el directorio del propio segmento) y, donde no hacen
# falta, `secrets/` (inventario, tokens de Matrix/webhooks, SOPS). Solo main ve `secrets/`.
name: argos

x-egress: &egress
  build: {context: ., dockerfile: docker/egress/Dockerfile, args: {UID: "${UID:-1000}"}}
  image: argos-egress:latest
  restart: unless-stopped
  user: "${UID:-1000}:${GID:-1000}"
  healthcheck:   # RNF-11
    test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 3128), 2)"]
    interval: 30s
    timeout: 5s
    retries: 3

x-core: &core
  build: {context: ., dockerfile: docker/core/Dockerfile}
  image: argos-core:latest
  profiles: [core]
  user: "${UID:-1000}:${GID:-1000}"
  working_dir: ${ARGOS_DIR:?ejecuta scripts/setup-env.sh}
  stdin_open: true
  tty: true

services:
  egress-main:
    <<: *egress
    volumes: ["./var/egress/main:/var/egress"]
    networks: [sandbox_main, egress_main]
  egress-osint:
    <<: *egress
    volumes: ["./var/egress/osint:/var/egress"]
    networks: [sandbox_osint, egress_osint]
  egress-pentest:
    <<: *egress
    volumes: ["./var/egress/pentest:/var/egress"]
    networks: [sandbox_pentest, egress_pentest]

  # Broker de sandbox (ADR-0008): ÚNICO servicio con el socket Docker. Sin red: solo habla por
  # los sockets Unix de cada segmento (var/broker/<seg>/broker.sock).
  broker:
    image: argos-core:latest
    restart: unless-stopped
    user: "${UID:-1000}:${GID:-1000}"
    group_add: ["${DOCKER_GID:-958}"]
    network_mode: none
    working_dir: ${ARGOS_DIR}
    entrypoint: ["python", "-m", "argos.sandbox.broker"]
    environment:
      PYTHONPATH: ${ARGOS_DIR}/src
    volumes:
      - ${ARGOS_DIR}:${ARGOS_DIR}:ro
      - ${ARGOS_DIR}/var/segments:${ARGOS_DIR}/var/segments
      - ${ARGOS_DIR}/var/egress:${ARGOS_DIR}/var/egress
      - ${ARGOS_DIR}/var/broker:${ARGOS_DIR}/var/broker
      - /var/run/docker.sock:/var/run/docker.sock

  # Servidor Kali para auditoría de servicios PROPIOS (UC-2, ADR-0013). Solo arranca con
  # `--profile kali`. Sin puertos publicados al host; solo lo alcanza core-pentest por la red
  # interna `kali`. El alcance autorizado y la aprobación humana los aplica Argos, no este
  # contenedor. Para llegar a objetivos en tu LAN, añade aquí la red correspondiente.
  kali:
    build: {context: ., dockerfile: docker/kali/Dockerfile}
    image: argos-kali:latest
    profiles: [kali]
    restart: unless-stopped
    networks: [kali]
    # Least-privilege: se descartan todas las capacidades y se reañaden solo las que el escaneo
    # de red real necesita (raw sockets para SYN/ping, NET_ADMIN para algunas sondas).
    cap_drop: [ALL]
    cap_add: [NET_RAW, NET_ADMIN]
    security_opt: ["no-new-privileges"]

  # Solo para construir la imagen; los contenedores de sandbox se crean por sesión.
  sandbox-image:
    build: {context: docker/sandbox, args: {UID: "${UID:-1000}", GID: "${GID:-1000}"}}
    image: argos-sandbox:latest
    profiles: [build]
    network_mode: none

  # Núcleos: el proyecto se monta en solo lectura en la misma ruta que en el host; cada uno solo
  # puede escribir en los datos y la política de egress de su segmento.
  core:
    <<: *core
    networks: [egress_main]
    environment:
      ARGOS_SEGMENT: main
      PYTHONPATH: ${ARGOS_DIR}/src
      SOPS_AGE_KEY_FILE: /age/age.key
      ARGOS_KEY_DIR: /age
    volumes:
      - ${ARGOS_DIR}:${ARGOS_DIR}:ro
      - {type: tmpfs, target: "${ARGOS_DIR}/var", tmpfs: {size: 1m}}      # otros segmentos: fuera
      - ${ARGOS_DIR}/var/segments/main:${ARGOS_DIR}/var/segments/main
      - ${ARGOS_DIR}/var/broker/main:${ARGOS_DIR}/var/broker/main
      - ${ARGOS_CODEX_HOME:?ejecuta scripts/setup-env.sh}:/codex
      - ${ARGOS_AGE_DIR:?ejecuta scripts/setup-env.sh}:/age      # secretos: solo main
    depends_on: [egress-main, broker]

  core-osint:
    <<: *core
    networks: [egress_osint]
    environment:
      ARGOS_SEGMENT: osint
      PYTHONPATH: ${ARGOS_DIR}/src
    volumes:
      - ${ARGOS_DIR}:${ARGOS_DIR}:ro
      - {type: tmpfs, target: "${ARGOS_DIR}/var", tmpfs: {size: 1m}}      # otros segmentos: fuera
      - {type: tmpfs, target: "${ARGOS_DIR}/secrets", tmpfs: {size: 1m}}  # sin credenciales
      - ${ARGOS_DIR}/var/segments/osint:${ARGOS_DIR}/var/segments/osint
      - ${ARGOS_DIR}/var/broker/osint:${ARGOS_DIR}/var/broker/osint
      - ${ARGOS_CODEX_HOME}:/codex
    depends_on: [egress-osint, broker]

  core-pentest:
    <<: *core
    networks: [egress_pentest, kali]
    environment:
      ARGOS_SEGMENT: pentest
      PYTHONPATH: ${ARGOS_DIR}/src
    volumes:
      - ${ARGOS_DIR}:${ARGOS_DIR}:ro
      - {type: tmpfs, target: "${ARGOS_DIR}/var", tmpfs: {size: 1m}}      # otros segmentos: fuera
      - {type: tmpfs, target: "${ARGOS_DIR}/secrets", tmpfs: {size: 1m}}  # sin credenciales
      - ${ARGOS_DIR}/var/segments/pentest:${ARGOS_DIR}/var/segments/pentest
      - ${ARGOS_DIR}/var/broker/pentest:${ARGOS_DIR}/var/broker/pentest
      - ${ARGOS_CODEX_HOME}:/codex
    depends_on: [egress-pentest, broker]

  # Núcleo persistente del segmento main (RF-04): API en var/segments/main/run/argos.sock,
  # scheduler y webhooks en 127.0.0.1:8787. Clientes: `scripts/argos core status|submit|attach`.
  daemon:
    <<: *core
    profiles: [daemon]
    command: ["serve", "--hooks-host", "0.0.0.0", "--hooks-port", "8787"]
    restart: unless-stopped
    stdin_open: false
    tty: false
    ports: ["127.0.0.1:8787:8787"]
    networks: [egress_main]
    env_file: [{path: secrets/hooks.env, required: false}]   # tokens ARGOS_HOOK_*_TOKEN
    environment:
      ARGOS_SEGMENT: main
      PYTHONPATH: ${ARGOS_DIR}/src
      SOPS_AGE_KEY_FILE: /age/age.key
      ARGOS_KEY_DIR: /age
    volumes:
      - ${ARGOS_DIR}:${ARGOS_DIR}:ro
      - {type: tmpfs, target: "${ARGOS_DIR}/var", tmpfs: {size: 1m}}      # otros segmentos: fuera
      - ${ARGOS_DIR}/var/segments/main:${ARGOS_DIR}/var/segments/main
      - ${ARGOS_DIR}/var/broker/main:${ARGOS_DIR}/var/broker/main
      - ${ARGOS_CODEX_HOME}:/codex
      - ${ARGOS_AGE_DIR}:/age
    depends_on: [egress-main, broker]

  # Puente Matrix (RF-07): cliente de la API del núcleo `daemon`. Sin socket Docker, sin clave age
  # y sin `secrets/`: su token llega por entorno (secrets/matrix.env, `argos matrix-login`).
  matrix:
    <<: *core
    profiles: [daemon]
    command: ["matrix"]
    restart: unless-stopped
    stdin_open: false
    tty: false
    env_file: [{path: secrets/matrix.env, required: false}]
    environment:
      ARGOS_SEGMENT: main
      PYTHONPATH: ${ARGOS_DIR}/src
    volumes:
      - ${ARGOS_DIR}:${ARGOS_DIR}:ro
      - {type: tmpfs, target: "${ARGOS_DIR}/var", tmpfs: {size: 1m}}      # otros segmentos: fuera
      - {type: tmpfs, target: "${ARGOS_DIR}/secrets", tmpfs: {size: 1m}}  # sin credenciales
      - ${ARGOS_DIR}/var/segments/main:${ARGOS_DIR}/var/segments/main
    networks: [egress_main]
    depends_on: [daemon]

networks:
  # Redes de sandbox: internas, sin salida. Cada una solo alcanza al proxy de su segmento.
  sandbox_main:
    name: argos_sandbox_main
    internal: true
  sandbox_osint:
    name: argos_sandbox_osint
    internal: true
  sandbox_pentest:
    name: argos_sandbox_pentest
    internal: true
  # Salida a Internet/LAN, una por segmento: los núcleos y proxies de un segmento no alcanzan a
  # los de otro (ni al daemon ni al proxy de main, que abre la LAN).
  egress_main:
    name: argos_egress_main
  egress_osint:
    name: argos_egress_osint
  egress_pentest:
    name: argos_egress_pentest
  # Red del servidor Kali: bridge (con salida) para poder auditar objetivos reales en LAN o
  # Internet. La contención NO es de red aquí, sino el alcance autorizado + la aprobación humana
  # + la auditoría que aplica Argos (ADR-0013). La comparten kali y core-pentest.
  kali:
    name: argos_kali
    driver: bridge

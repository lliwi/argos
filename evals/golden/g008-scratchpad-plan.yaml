id: g008-scratchpad-plan
description: En una tarea de varios pasos el agente mantiene un plan en el scratchpad (RF-CTX-07).
profile: personal
prompt: >
  Crea tres ficheros: out/a.txt con "1", out/b.txt con "2" y out/c.txt con "3". Es una tarea de
  varios pasos: registra primero tu plan con scratchpad.write y márcalo como completado al final.
fake_script:
  - {type: tool_call, tool: scratchpad.write, args: {section: plan, content: "1. a.txt\n2. b.txt\n3. c.txt"}}
  - {type: tool_call, tool: workspace.write_file, args: {path: out/a.txt, content: "1"}}
  - {type: tool_call, tool: workspace.write_file, args: {path: out/b.txt, content: "2"}}
  - {type: tool_call, tool: workspace.write_file, args: {path: out/c.txt, content: "3"}}
  - {type: tool_call, tool: scratchpad.write, args: {section: plan, content: "1-3 completados"}}
  - {type: final, message: "Creados a.txt, b.txt y c.txt."}
checks:
  - {type: status, equals: completed}
  - {type: event, event: plan_event}
  - {type: file_contains, path: out/c.txt, pattern: "^3$"}
  - {type: max_steps, value: 9}

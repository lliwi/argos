id: a01-trayecto
description: >
  Decisión bici/coche del trayecto (la tarea programada real). Eficacia: la decisión coincide con
  la que sale de la previsión real y tus umbrales. Coste acotado: es diaria.
profile: orchestrator
requires: [live]
session_budget_tokens: 60000
prompt: >
  Decide si mañana voy al trabajo en bicicleta o en coche. Consulta la previsión por horas de
  mañana en Barcelona y fíjate solo en dos franjas: la ida, de 7:00 a 8:00, y la vuelta, de
  17:00 a 18:00. Elige COCHE si en cualquiera de las dos franjas hay lluvia (más de 0.2 mm o
  probabilidad del 40 % o más), viento de 30 km/h o más, o temperatura por debajo de 5 °C; si
  no, BICI. Responde breve: primera línea «🚲 Bici» o «🚗 Coche» con el motivo; luego una línea
  por franja con temperatura, lluvia y viento.
checks:
  - {type: status, equals: completed}
  - {type: live, probe: weather.commute}
  - {type: tool_called, tool: weather.hourly, status: ok}
  - {type: no_event, event: approval}
  - {type: max_steps, value: 4, required: false}
  - {type: max_tokens, value: 40000, required: false}

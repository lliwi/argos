# Inventario de infraestructura de Argos. Copia este fichero a secrets/inventory.yaml y rellénalo.
# secrets/inventory.yaml está en .gitignore y nunca se versiona.
#
# Los campos "secretos" (api_key, apikey, token, password, secret, passphrase, key) se redactan de
# la auditoría y NUNCA se envían al modelo: se inyectan directamente en las herramientas que los
# necesitan. El resto (url, endpoint, username, notes) es documentación que el agente sí puede leer
# con la tool `infra.inventory`, para saber qué hay sin que se lo cuentes por el chat.

services:
  portainer:
    url: http://192.168.0.20:9000
    endpoint: 1                 # id del entorno de Portainer a gestionar (mira la URL en la UI)
    api_key: "PON-AQUI-TU-API-KEY"
    notes: "Portainer del NAS. Gestiona los stacks de casa."

  homeassistant:
    url: http://homeassistant.home:8123
    token: "PON-AQUI-TU-TOKEN-DE-LARGA-DURACION"
    notes: "Home Assistant. Perfil > Tokens de acceso de larga duración."

  jackett:
    url: http://jackett.home:9117
    api_key: "PON-AQUI-LA-API-KEY-DE-JACKETT"
    notes: "Buscador de indexadores (Jackett)."

  transmission:
    url: http://transmission.home:9091
    # username/password solo si tu Transmission los pide:
    # username: usuario
    # password: "..."
    notes: "Cliente de descargas Transmission."

  # ejemplos adicionales (opcionales):
  # nas:
  #   url: https://192.168.0.10:5001
  #   username: argo
  #   password: "..."
  #   notes: "TerraMaster, DSM."

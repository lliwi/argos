# Tareas programadas y webhooks (§6.4). Cada ejecución es una sesión auditada propia, sin
# aprobador humano: cualquier acción que requiera aprobación se deniega (RF-GOV-05).
timezone: Europe/Madrid

schedules:
  # Cada tarea la recibe el orquestador (perfil por defecto), que pide el trabajo al perfil
  # adecuado. El resultado llega al chat de Matrix (notify). Cron: min hora día mes día_semana
  # (0 = domingo).
  - name: trayecto-trabajo
    title: Trayecto trabajo
    cron: "0 18 * * 0-4"         # domingo a jueves a las 18:00 (Europe/Madrid)
    task: >
      Decide si mañana voy al trabajo en bicicleta o en coche. Consulta la previsión por horas
      de mañana en Barcelona (weather.hourly, con horas suficientes para cubrir todo mañana) y
      fíjate solo en dos franjas: la ida, de 7:00 a 8:00, y la vuelta, de 17:00 a 18:00.
      Elige COCHE si en cualquiera de las dos franjas hay lluvia (más de 0.2 mm o probabilidad
      del 40 % o más), viento de 30 km/h o más, o temperatura por debajo de 5 °C; si no, BICI.
      Responde en español, breve y para leer en el móvil: primera línea «🚲 Bici» o «🚗 Coche»
      con el motivo principal; luego una línea por franja con temperatura, lluvia (mm y %) y
      viento (km/h y dirección). No hagas nada más.
    budget_tokens: 40000

  # Evaluación de eficacia de Argos (suite evals/argos): tus consultas reales puntuadas contra
  # el dato verdadero de cada servicio, la seguridad de las acciones y el coste. Informe al chat
  # de Matrix comparado con la semana anterior. ~9 sesiones reales: ~250–350k tokens por corrida.
  - name: evaluacion-argos
    title: Evaluación semanal de Argos
    kind: eval
    suite: argos
    cron: "0 10 * * 0"           # domingos a las 10:00

# Webhooks: POST http://127.0.0.1:<puerto>/hooks/<name> con cabecera X-Argos-Token.
# El payload es dato no confiable; el perfil destino no puede tener secretos potentes.
hooks:
  - name: aviso
    profile: personal
    token_env: ARGOS_HOOK_AVISO_TOKEN
    task_template: >
      Ha llegado este aviso externo. Crea un recordatorio para hoy con un resumen de una línea.
      {payload}
    enabled: false

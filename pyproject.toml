[project]
name = "argos"
version = "0.1.0"
description = "Arnés de agentes personal, auditable y evaluable."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.8",
    "typer>=0.12",
    "rich>=13.7",
    "pyyaml>=6.0",
    "mcp>=1.2",
    "starlette>=0.40",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "tzdata>=2024.1",
]

[project.scripts]
argos = "argos.cli:app"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/argos"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["docker: requiere daemon Docker", "codex: requiere Codex CLI autenticado"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]
# Ficheros locales pequeños (JSONL, SQLite, políticas): bloquear el loop unos µs es aceptable.
ignore = ["ASYNC230", "ASYNC240"]
